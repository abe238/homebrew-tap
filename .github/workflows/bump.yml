name: bump

# Started by hand or by scripts/local-bump.sh only; there is no schedule.
# The installing and testing happens on a Mac at home (scripts/local-bump.sh). That job then starts this one
# with the names, versions and checksums it tested. This job works out the same update again on Linux (a few
# seconds) and writes it to main only when each formula file is byte for byte what was tested.
# "test_all" is a separate, manual check of every formula on GitHub's Mac runner.

on:
  workflow_dispatch:
    inputs:
      tested:
        description: "What was tested, as name=version=sha256 of the formula file, space separated"
        type: string
        default: ""
      test_all:
        description: "Install and test every formula on GitHub's Mac runner"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: bump
  cancel-in-progress: false

jobs:
  publish:
    if: inputs.tested != '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Work out the update and compare it with what was tested
        id: bump
        env:
          TESTED: ${{ inputs.tested }}
        run: |
          set -euo pipefail
          for t in $TESTED; do
            if ! printf '%s' "$t" | grep -Eq '^[a-z0-9][a-z0-9-]*=[0-9][0-9.]*[0-9]=[0-9a-f]{64}$'; then
              echo "Not in the form name=version=sha256: $t"; exit 1
            fi
          done
          python3 -I scripts/bump.py > bump.log
          cat bump.log
          changed="$(sed -n 's/^CHANGED: //p' bump.log)"
          rm -f bump.log
          entry() {
            v="$(sed -En 's/^  url ".*[-v]([0-9][0-9.]*[0-9])\.(tgz|tar\.gz)"$/\1/p' "Formula/$1.rb")"
            s="$(sha256sum "Formula/$1.rb" | cut -d' ' -f1)"
            echo "$1=$v=$s"
          }
          # Everything this run would change must have been tested, exactly as tested.
          for n in $changed; do
            e="$(entry "$n")"
            case " $TESTED " in *" $e "*) ;; *) echo "Not tested as it would be published: $e"; exit 1 ;; esac
          done
          # Everything that was tested must be either this run's change or what main already holds.
          for t in $TESTED; do
            n="${t%%=*}"
            [ -f "Formula/$n.rb" ] || { echo "No such formula: $n"; exit 1; }
            [ "$(entry "$n")" = "$t" ] || { echo "Tested $t but the current result is $(entry "$n")"; exit 1; }
          done
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          if [ -z "$changed" ]; then echo "main already holds everything that was tested."; fi

      # Written through GitHub's API, one file per commit, so the commit is made by GitHub's own bot account.
      - name: Publish the new versions
        if: steps.bump.outputs.changed != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGED: ${{ steps.bump.outputs.changed }}
        run: |
          set -euo pipefail
          for n in $CHANGED; do
            f="Formula/$n.rb"
            # The file as it was when this job checked it out: GitHub refuses the write if main changed since.
            sha="$(git rev-parse "HEAD:$f")"
            v="$(sed -En 's/^  url ".*[-v]([0-9][0-9.]*[0-9])\.(tgz|tar\.gz)"$/\1/p' "$f")"
            gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$f" \
              -f message="$n $v" -f branch=main -f sha="$sha" -f content="$(base64 -w0 < "$f")" > /dev/null
            echo "published $n $v"
          done

  test-all:
    if: inputs.test_all && inputs.tested == ''
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The checkout itself is used as the tap (a link, not a clone).
      - name: Install and test every formula
        run: |
          set -euo pipefail
          taps="$(brew --repository)/Library/Taps/abe238"
          mkdir -p "$taps"
          ln -s "$GITHUB_WORKSPACE" "$taps/homebrew-tap"
          for f in Formula/*.rb; do
            n="$(basename "$f" .rb)"
            brew install --build-from-source "abe238/tap/$n"
            brew test "abe238/tap/$n"
          done
